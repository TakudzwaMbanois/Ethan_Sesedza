<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Temporarily Unavailable</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f6f8;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        padding:20px;
    }

    .box{
        background:#ffffff;
        max-width:500px;
        width:100%;
        padding:40px 30px;
        border-radius:14px;
        box-shadow:0 10px 30px rgba(0,0,0,0.08);
        text-align:center;
    }

    h1{
        color:#111827;
        font-size:28px;
        margin-bottom:15px;
    }

    p{
        color:#6b7280;
        font-size:16px;
        line-height:1.7;
        margin-bottom:14px;
    }

    .highlight{
        color:#2563eb;
        font-weight:bold;
    }
</style>
</head>
<body>

<div class="box">
    <h1>Website Temporarily Unavailable</h1>
    <p>This website has been temporarily shut down pending subscription renewal.</p>
    <p>Please contact your developer for assistance and reactivation.</p>
    <p class="highlight">Thank you for your understanding.</p>
</div>

</body>
</html>
